<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Chinnawan Sriprasong — Frontend / Full-Stack Developer and Computer Engineering Technology student at KMUTNB."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Kanit:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Chinnawan Sriprasong — Portfolio</title>
    <script>
      // Apply saved theme/language before first paint to avoid a flash
      try {
        var theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
        var lang = localStorage.getItem("lang");
        if (lang) document.documentElement.lang = lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
